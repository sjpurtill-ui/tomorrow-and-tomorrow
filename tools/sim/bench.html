<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator</title>
<link rel="icon" href="data:,">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--raised:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --border:rgba(11,11,11,.10);--wash:rgba(11,11,11,.04);--accent:#2a78d6;--accent-ink:#ffffff;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --good:#006300;--bad:#b3261e;--changed:#fff3d6;--changed-edge:#eda100;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--raised:#222220;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
  --border:rgba(255,255,255,.10);--wash:rgba(255,255,255,.05);--accent:#3987e5;--accent-ink:#ffffff;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --good:#0ca30c;--bad:#e66767;--changed:#3a2f12;--changed-edge:#c98500;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
h1{font-size:18px;margin:0;font-weight:650}
h2{font-size:16px;margin:0;font-weight:650}
h3{font-size:13px;margin:0;font-weight:600}
.sub{color:var(--ink2);font-size:13px}
.small{font-size:12px;color:var(--ink2)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
#app{display:grid;grid-template-columns:400px 1fr;height:100vh}
#left{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
#left header{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
#form{overflow:auto;flex:1;padding:4px 0 12px}
#runbar{border-top:1px solid var(--border);padding:12px 16px;background:var(--raised)}
#right{overflow:auto;min-width:0}
.step{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--page);font-size:12px;font-weight:650;margin-right:8px;flex:none}
details.grp{border-bottom:1px solid var(--border)}
details.grp>summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;align-items:baseline;gap:8px;user-select:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:before{content:"▸";color:var(--muted);font-size:11px;width:10px}
details.grp[open]>summary:before{content:"▾"}
details.grp>summary .t{font-weight:600}
details.grp>summary .v{margin-left:auto;color:var(--ink2);font-size:12px;text-align:right}
.body{padding:2px 16px 14px 34px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1;min-width:0}
.hint{color:var(--ink2);font-size:12px;margin:4px 0 8px}
input[type=number],input[type=text],select{background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{width:84px;text-align:right;font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--border);background:var(--raised);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.seg button:hover,.chip:hover{background:var(--wash)}
.seg button.on,.chip.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn{border:1px solid var(--border);background:var(--raised);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:650;padding:9px 18px;font-size:15px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.link{border:none;background:none;padding:2px 4px;color:var(--accent);cursor:pointer;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--wash);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.knob{padding:8px 10px;border-radius:8px;margin:4px 0;border:1px solid transparent}
.knob.changed{background:var(--changed);border-color:var(--changed-edge)}
.knob .top{display:flex;align-items:center;gap:8px}
.knob .nm{flex:1;min-width:0;font-weight:550}
.knob .fx{font-size:12px;color:var(--ink2);margin-top:2px}
.knob .was{font-size:12px;color:var(--ink2);white-space:nowrap}
.gh{font-size:12px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
#right>header{position:sticky;top:0;z-index:5;background:var(--page);border-bottom:1px solid var(--border);padding:12px 20px 10px}
#cards{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
#legend .k{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
#legend .k.f{font-weight:650}
.card{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 10px;width:270px;display:flex;flex-direction:column;gap:4px}
.card.off{opacity:.62}
.card.focus{box-shadow:0 0 0 2px var(--ink)}
.card .hd{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:4px;border-radius:2px;flex:none}
.card .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .acts{display:flex;gap:2px;flex-wrap:wrap}
#nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
main{padding:16px 20px 80px;max-width:1500px}
#main{display:block}
section{margin-bottom:28px;scroll-margin-top:110px}
section>h2{margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.tile .v{font-size:24px;font-weight:650;line-height:1.2}
.tile .d{font-size:12px}
.up{color:var(--good)}.down{color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;margin-top:10px}
.charts.mini{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px 6px}
.chart .u{font-size:12px;color:var(--ink2);min-height:17px}
.chart canvas{width:100%;height:190px;display:block;margin-top:4px}
.charts.mini canvas{height:120px}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:none;max-width:320px}
#tip .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
#tip .r b{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px}
.box p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-weight:600;color:var(--ink2);position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
.scroll{overflow:auto;max-height:460px}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;border:1px solid var(--border)}
.tag.early{background:rgba(42,120,214,.14)}.tag.late{background:rgba(227,73,72,.16)}.tag.ok{background:rgba(12,163,12,.14)}
.empty{padding:60px 20px;text-align:center;color:var(--ink2)}
.err{color:var(--bad);white-space:pre-wrap;font-size:12px}
@media (max-width:900px){#app{grid-template-columns:1fr;height:auto}#left{border-right:none}#form{max-height:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <header>
      <h1>Simulator</h1>
      <div class="sub">Runs the game's own rules on a hidden, throwaway people. Set the numbers, run, compare. Nothing here changes the game or your saves.</div>
    </header>
    <div id="form"></div>
    <div id="runbar">
      <div class="row"><input type="text" id="runname" placeholder="Name this run (optional)" style="flex:1"></div>
      <div class="row">
        <button class="btn primary" id="go">▶ Run</button>
        <div class="small" id="gosum" style="flex:1"></div>
        <button class="btn" id="reset" title="Put every number back to the game's own">Reset all</button>
      </div>
    </div>
  </aside>
  <div id="right">
    <header>
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <h2>Results</h2>
        <div id="legend" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"></div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px" class="small">
          Show years <input type="number" id="x0" value="0" min="0" style="width:70px"> to <input type="number" id="x1" placeholder="end" min="1" style="width:70px">
          <button class="chip" data-range="all">All</button><button class="chip" data-range="100">First 100</button><button class="chip" data-range="last">Last 300</button>
        </div>
      </div>
      <div id="nav"></div>
    </header>
    <main><section id="s-runs"><h2>Runs</h2><div class="sub" id="runsnote"></div><div id="cards"></div></section><div id="main"></div></main>
  </div>
</div>
<div id="tip"></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}for(const k of kids.flat())if(k!=null&&k!==false)e.append(k.nodeType?k:document.createTextNode(k));return e};
const api=async(path,body)=>{const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);return r.json()};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------------------------------------------------------------- words
const ROLE={Food:"Getting food",Survey:"Scouting and surveying",Extraction:"Cutting and digging materials",Construction:"Building",Crafting:"Making goods",Logistics:"Carrying",Knowledge:"Learning",Administration:"Caring and keeping (administration)",Defense:"The watch (the army)"};
const PATH={balanced:"Balanced",growth:"Growth",making:"Making",war:"War",learning:"Learning",building:"Building"};
const SPLIT={balanced:"Balanced",big_dumb:"Many and simple",small_smart:"Few and learned",war_heavy:"War-heavy",making_heavy:"Making-heavy"};
const LAND={forage:"Wild plants to gather",game:"Game to hunt",fertility:"Soil",growing_season:"Growing season",water_access:"Water close by",rainfall_variability:"How unsteady the rain is",precipitation:"Rain",ecological_resilience:"How well the land recovers"};
const AGE={children:"children",youth:"youths",early_adults:"young adults",established_adults:"adults",mature_adults:"older adults",elders:"elders"};
const OUT={population:"People",life_expectancy:"Life expectancy",infant_mortality:"Babies lost",food_days:"Food in store",known:"Discoveries",goods_per_head:"Goods a head",field_strength:"Field strength",home_quality:"Home quality",crisis_deaths:"Deaths in crises"};
const NINE=["might","endurance","wealth","reach","persuasion","splendor","genius","cunning","order"];

// ---------------------------------------------------------------- what is drawn
// key, title, unit line; o: tight (do not start the scale at 0), smooth (years averaged), pct, ref (a marked level)
const C=(key,title,unit,o={})=>({key,title,unit,...o});
const SECTIONS=[
 {id:"people",title:"People",note:"How many there are, and how fast they are born and die.",charts:[
   C("population","People","everyone alive"),
   C("growth","Growth","% a year, 10-year average",{smooth:10,tight:true,ref:0}),
   C("births_rate","Births","per 1,000 people a year, 10-year average",{smooth:10}),
   C("deaths_rate","Deaths","per 1,000 people a year, 10-year average",{smooth:10}),
   C("life_expectancy","Life expectancy at birth","years",{tight:true}),
   C("infant_mortality","Babies dying before their first birthday","per 1,000 born"),
   C("child_mortality_1_4","Children dying between 1 and 4","per 1,000"),
   C("carrying_capacity","People the land can hold","before crowding bites"),
   C("crowding","Crowding","0 = room to spare, 1 = full"),
   C("towns","Towns","")],
  mini:{title:"Ages (share of the people)",charts:Object.keys(AGE).map(k=>C("ageshare_"+k,cap(AGE[k]),"% of the people"))}},
 {id:"food",title:"Food",note:"What is in store, who gets it, and what the land gives.",charts:[
   C("food_days","Food in store","days it would last"),
   C("work_Food","People getting food","% of the workers"),
   C("food_per_worker","Food one food worker brings in","rations a day",{tight:true}),
   C("intake","How much of their need people eat","1 = everyone fed in full",{tight:true}),
   C("diet","Variety of the diet","0 to 1",{tight:true}),
   C("malnutrition","Malnutrition","0 = none"),
   C("land_yield","What surveyed land gives","1 = unsurveyed land",{tight:true}),
   C("food_alarm","Food alarm","share of the time the leaders pull hands to food",{smooth:10})],
  mini:{title:"Where the food comes from (rations a day)",charts:[["plants","Gathered plants"],["meat","Hunted meat"],["fish","Fish"],["staples","Field staples"]].map(([k,t])=>C("harvest_"+k,t,"rations a day"))}},
 {id:"work",title:"Work",note:"How the people's working days are shared out.",charts:[
   C("able","People able to work",""),
   C("labor_efficiency","How well the work goes","health, housing and unity together; 1 = normal",{tight:true})],
  mini:{title:"Share of the workers on each job",charts:Object.keys(ROLE).map(k=>C("work_"+k,ROLE[k],"% of the workers"))}},
 {id:"society",title:"Health and order",note:"The condition of the people and of the land they live on.",charts:[
   C("health","Health","0 to 1",{tight:true}),
   C("cohesion","Unity","0 to 1",{tight:true}),
   C("legitimacy","Trust in the rulers","0 to 1",{tight:true}),
   C("security","Safety","0 to 1",{tight:true}),
   C("housing_ratio","Homes for the people","1 = everyone housed",{tight:true}),
   C("ecology","Health of the land","0 to 1",{tight:true})]},
 {id:"learning",title:"Learning",note:"What the people know, and how quickly they come to know more.",charts:[
   C("known","Discoveries known","of the game's questions"),
   C("learned_year","Discoveries made","a year, 10-year average",{smooth:10}),
   C("knowledge_workers","Learners","people"),
   C("work_Knowledge","Learners","% of the workers"),
   C("scholarship","Scholarship","built up over the years"),
   C("education","Education","0 to 1"),
   C("literacy","People who can read","%"),
   C("lead","Years ahead of the age","0 = level with the calendar",{tight:true,ref:0}),
   C("urban_share","People living in towns of size","%")],
  mini:{title:"Discoveries in each field",charts:"LINES"}},
 {id:"making",title:"Making and wealth",note:"Materials brought in, goods made, and what a household holds.",charts:[
   C("goods_per_head","Goods a head","held by households"),
   C("goods_made","Goods made","a day"),
   C("extracted","Materials brought in","loads a day"),
   C("raw","Materials in the yards","loads"),
   C("output","Everything produced","a day, in rations' worth"),
   C("tool_quality","Quality of tools","from what is known"),
   C("craft_output","Skill at making","from what is known"),
   C("trade_capacity","Means to trade","from what is known")]},
 {id:"war",title:"The watch and war",note:"The watch is the army: how many, how armed, how drilled.",charts:[
   C("watch","People on watch",""),
   C("work_Defense","People on watch","% of the workers"),
   C("armed","Watch that has arms","1 = all of them",{tight:true}),
   C("drill","Drill","0 to 1",{tight:true}),
   C("field_strength","Field strength","the watch counted by drill and arms"),
   C("walls","Walls","0 = none")]},
 {id:"built",title:"Homes and great works",note:"What the builders have made of the place.",charts:[
   C("home_quality","Quality of the homes","0 to 1"),
   C("roads","Roads","0 to 1"),
   C("beauty","Beauty","0 to 1"),
   C("stone_share","Homes built in stone","share"),
   C("great_works","Great works standing",""),
   C("triumphs","Great works that were triumphs",""),
   C("follies","Great works that fell",""),]},
 {id:"standing",title:"Standing",note:"The nine strengths, each measured against a typical people of the same age: 50 is typical.",charts:[],
  mini:{title:"",charts:NINE.map(k=>C("st_"+k,cap(k),"0 to 100; 50 = a typical people of the age",{ref:50,fixed:[0,100]}))}},
 {id:"causes",title:"What people die of",note:"Water, and the deaths of the last year by cause, as the game counts them.",charts:[
   C("water_intake","Water drunk","share of their need; 1 = in full",{tight:true}),
   C("water_days","Water in reach","days")],
  mini:{title:"Deaths in the last year, by cause",charts:"CAUSES"}},
 {id:"crises",title:"Crises",note:"Outbreaks, fires, floods, droughts and hungers, and what they cost.",charts:[
   C("crisis_rate","Deaths in crises","per 1,000 people a year, 10-year average",{smooth:10}),
   C("crisis_deaths","Deaths in crises","all so far")],
  mini:{title:"Deaths so far, by cause",charts:"CRISES"}},
];
const TILES=[["population","People"],["life_expectancy","Life expectancy (years)"],["infant_mortality","Babies lost per 1,000"],["food_days","Days of food in store"],["known","Discoveries known"],["goods_per_head","Goods a head"],["field_strength","Field strength"],["towns","Towns"]];
const TABLE=[["population","People"],["births_rate","Births /1,000"],["deaths_rate","Deaths /1,000"],["life_expectancy","Life exp."],["infant_mortality","Babies lost /1,000"],["food_days","Food days"],["work_Food","Food work %"],["work_Knowledge","Learners %"],["work_Defense","Watch %"],["known","Discoveries"],["goods_per_head","Goods a head"],["field_strength","Field strength"],["towns","Towns"],["crisis_deaths","Crisis deaths"]];

// ---------------------------------------------------------------- state
let M=null;                       // /api/meta
let F=null;                       // the form's numbers
const S={runs:[],focus:null,x0:0,x1:null,hover:null,knobView:"main",knobQuery:""};
const SLOTS=["--s1","--s2","--s3","--s4"];

function defaults(){
  return {years:600,worlds:2,seed0:1,start_population:120,site:"good",site_profile:{},mode:"leaders",path:"balanced",ambition:M.ambitions.includes("makers")?"makers":M.ambitions[0],
    manual:{...M.splits.balanced},phases:[],research:{...M.research},towns:false,crises:true,shocks:false,knobs:{},
    engine:M.game.unavailable?"copy":"game",span:30,consts:{}};
}
function saveForm(){store.set("bench.form",F)}

// ---------------------------------------------------------------- numbers as words
function fmt(v,digits){
  if(v==null||!isFinite(v))return "–";
  const a=Math.abs(v);
  if(a>=1e9)return (v/1e9).toFixed(a>=1e10?1:2)+"B";
  if(a>=1e6)return (v/1e6).toFixed(a>=1e7?1:2)+"M";
  if(a>=100)return Math.round(v).toLocaleString("en-US");
  if(a>=10)return (+v.toFixed(1)).toLocaleString("en-US");
  if(a>=1)return (+v.toFixed(2)).toString();
  if(a===0)return "0";
  return (+v.toPrecision(digits||2)).toString();
}
const plain=v=>{const a=Math.abs(v);return a>=1000?Math.round(v).toLocaleString("en-US"):(+v.toPrecision(4)).toString()};
const pct=v=>(v>0?"+":"−")+fmt(Math.abs(v))+"%";

// ---------------------------------------------------------------- the form
function grp(id,title,valueText,build,open){
  const d=el("details",{class:"grp",id:"g-"+id});
  if(store.get("bench.open."+id,open))d.open=true;
  d.addEventListener("toggle",()=>store.set("bench.open."+id,d.open));
  const v=el("span",{class:"v"});
  d.append(el("summary",{},el("span",{class:"t"},title),v),el("div",{class:"body"}));
  d._value=()=>{v.textContent=valueText()};d._build=()=>{const b=$(".body",d);b.textContent="";build(b);d._value()};
  return d;
}
function num(get,set,attrs={}){
  const i=el("input",{type:"number",...attrs});i.value=get();
  i.addEventListener("change",()=>{let v=parseFloat(i.value);if(!isFinite(v))v=get();if(attrs.min!=null)v=Math.max(+attrs.min,v);if(attrs.max!=null)v=Math.min(+attrs.max,v);i.value=v;set(v);saveForm();refreshForm()});
  return i;
}
function seg(options,get,set){
  const d=el("div",{class:"seg"});
  for(const[val,label]of options)d.append(el("button",{class:get()===val?"on":"",onclick:()=>{set(val);saveForm();buildForm()}},label));
  return d;
}
function splitEditor(parent,manual,after){
  const total=el("div",{class:"small"});
  const upd=()=>{const t=M.roles.reduce((a,r)=>a+(+manual[r]||0),0);total.textContent="Adds up to "+fmt(t)+(Math.abs(t-100)>0.5?" — the run will scale it to 100":"")};
  for(const r of M.roles){
    const bar=el("i");const set=v=>{manual[r]=v;bar.style.width=Math.min(100,v)+"%";upd();after&&after()};
    const i=el("input",{type:"number",min:0,max:100,step:1});i.value=manual[r]||0;bar.style.width=Math.min(100,manual[r]||0)+"%";
    i.addEventListener("input",()=>{set(Math.max(0,parseFloat(i.value)||0));saveForm()});
    parent.append(el("div",{class:"row"},el("label",{},ROLE[r]),el("div",{class:"bar",style:"max-width:70px"},bar),i));
  }
  parent.append(total);upd();
}
function buildForm(){
  const form=$("#form");const top=form.scrollTop;form.textContent="";
  const game=F.engine==="game";

function describe(spec){

function series(r,key,smooth){
  const ck=key+"|"+(smooth||0);const hit=r.cache.get(ck);if(hit&&hit.ver===r.ver)return hit;
  const lists=r.seeds.map(s=>r.rows[s]).filter(a=>a.length);
  const n=Math.max(0,...lists.map(a=>a.length));
  const x=new Array(n),mean=new Array(n),lo=new Array(n),hi=new Array(n);
  for(let i=0;i<n;i++){
    let sum=0,c=0,a=Infinity,b=-Infinity,yr=null;
    for(const rows of lists){const row=rows[i];if(!row)continue;yr=row.year;const v=row[key];if(v==null)continue;sum+=v;c++;if(v<a)a=v;if(v>b)b=v}
    x[i]=yr;mean[i]=c?sum/c:null;lo[i]=c?a:null;hi[i]=c?b:null;
  }
  const out={ver:r.ver,x,mean,lo,hi,many:lists.length>1};
  if(smooth&&n>2){
    const w=Math.max(1,Math.round(smooth/Math.max(1e-9,(x[1]??1)-(x[0]??0))));
    for(const name of ["mean","lo","hi"]){const src=out[name],dst=new Array(n);let sum=0,c=0;
      for(let i=0;i<n;i++){if(src[i]!=null){sum+=src[i];c++}if(i>=w&&src[i-w]!=null){sum-=src[i-w];c--}dst[i]=c?sum/c:null}
      out[name]=dst}
  }
  r.cache.set(ck,out);return out;
}

        const cls=x.year<m.low?"early":x.year>m.high?"late":"ok";
        return el("td",{},"year "+Math.round(x.year)+(x.reached<x.worlds?" ("+x.reached+" of "+x.worlds+")":"")+" ",el("span",{class:"tag "+cls},cls==="ok"?"on time":cls))})))});
  s.append(el("div",{class:"box scroll"},t));return s;
}
function tableBlock(){
  const r=focus(),s=el("section",{id:"s-table"},el("h2",{},"Table"),el("div",{class:"sub"},"The run being read, at steps through its years. The download has every year and every number the simulator records."));
  if(!r)return s;
  const end=lastYear(r),step=end<=150?10:end<=600?50:end<=1500?100:200;
  const t=el("table");t.append(el("tr",{},el("th",{},"Year"),TABLE.map(([,l])=>el("th",{},l))));
  for(let y=0;y<=end+0.5;y+=step)t.append(el("tr",{},el("td",{},String(y)),TABLE.map(([k])=>el("td",{},fmt(at(r,k,y,k.endsWith("_rate")?10:0))))));
  s.append(el("div",{class:"box scroll"},t),el("div",{style:"margin-top:8px"},el("button",{class:"btn",onclick:()=>csv(r)},"Download every year (CSV)")));
  return s;
}
function csv(r){
  const keys=new Set();for(const sd of r.seeds)for(const row of r.rows[sd].slice(-1))for(const k of Object.keys(row))if(typeof row[k]==="number")keys.add(k);
  keys.delete("year");const cols=[...keys],P=series(r,"population");
  const lines=["year,"+cols.join(",")];const ss=cols.map(k=>series(r,k));
  for(let i=0;i<P.x.length;i++)lines.push(P.x[i]+","+ss.map(s=>s.mean[i]==null?"":+s.mean[i].toPrecision(6)).join(","));
  const a=el("a",{href:URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"})),download:r.name.replace(/[^\w\-]+/g,"_")+".csv"});document.body.append(a);a.click();a.remove();
}
function logsBlock(){
  const r=focus(),s=el("section",{id:"s-logs"},el("h2",{},"What happened"),el("div",{class:"sub"},"The first world of the run being read: every crisis and every discovery, in order."));
  if(!r)return s;const ex=r.extra[r.seeds[0]];
  if(!ex){s.append(el("div",{class:"box"},live(r)?"These lists fill in when the run finishes.":"Nothing was recorded."));return s}
  const cr=(ex.crises||[]).filter(c=>c.deaths>0);
  const ct=el("table");ct.append(el("tr",{},el("th",{},"Year"),el("th",{class:"l"},"Crisis"),el("th",{},"Dead")));
  for(const c of cr)ct.append(el("tr",{},el("td",{},fmt(c.year)),el("td",{class:"l"},cap(c.type)+(c.severe?" (severe)":"")),el("td",{},fmt(c.deaths))));
  const lt=el("table"),q=el("input",{type:"text",placeholder:"Search discoveries…",style:"width:260px"});
  const fill=()=>{lt.textContent="";lt.append(el("tr",{},el("th",{},"Year"),el("th",{class:"l"},"Discovery"),el("th",{class:"l"},"Field")));const f=q.value.trim().toLowerCase();let n=0;
    for(const[y,name,line]of ex.learned){if(f&&!(name+" "+line).toLowerCase().includes(f))continue;if(n++>=400){lt.append(el("tr",{},el("td",{class:"l",colspan:3},"…and more. Search to narrow.")));break}lt.append(el("tr",{},el("td",{},fmt(y)),el("td",{class:"l"},name),el("td",{class:"l"},cap(line))))}};
  q.addEventListener("input",fill);fill();
  s.append(el("h3",{style:"margin-top:12px"},"Crises that killed ("+cr.length+(ex.crises&&ex.crises.length>=400?", the latest 400 kept":"")+")"),el("div",{class:"box scroll",style:"max-height:300px"},cr.length?ct:"None."),
    el("h3",{style:"margin-top:14px"},"Discoveries ("+ex.learned.length.toLocaleString("en-US")+")"),el("div",{style:"margin-top:6px"},q),el("div",{class:"box scroll"},lt));
  return s;
}

// ---------------------------------------------------------------- start
async function start(){
  readCss();
  M=await api("/api/meta");for(const k of M.knobs)KNOB[k.id]=k;for(const k of M.consts)KNOB[k.id]=k;
  F={...defaults(),...store.get("bench.form",{})};
  for(const id of Object.keys(F.knobs))if(!KNOB[id])delete F.knobs[id];
  for(const id of Object.keys(F.consts))if(!KNOB[id])delete F.consts[id];
  if(F.engine==="game"&&M.game.unavailable)F.engine="copy";
  if(!M.paths.includes(F.path))F.path=M.paths[0];
  buildForm();
  $("#go").addEventListener("click",go);
  $("#reset").addEventListener("click",()=>{F=defaults();saveForm();buildForm()});
  const setRange=()=>{S.x0=Math.max(0,parseFloat($("#x0").value)||0);const b=parseFloat($("#x1").value);S.x1=isFinite(b)&&b>S.x0?b:null;drawAll()};
  $("#x0").addEventListener("change",setRange);$("#x1").addEventListener("change",setRange);
  for(const b of $$("[data-range]"))b.addEventListener("click",()=>{const k=b.dataset.range,end=Math.max(10,...shown().map(r=>r.spec.years));
    $("#x0").value=k==="last"?Math.max(0,end-300):0;$("#x1").value=k==="100"?100:"";setRange()});
  const runs=await api("/api/runs");
  for(const m of runs.live)addRun(m,false);
  for(const m of runs.saved)addRun(m,false);
  const recent=[...S.runs].sort((a,b)=>b.created-a.created).slice(0,2).reverse();
  for(const r of recent){r.shown=false;show(r,true)}
  renderAll();pollRuns();
}
start();
